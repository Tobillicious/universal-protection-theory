name: UPT summit publication packet

# Run on every PR so required 'source-and-metadata' is always reported.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable summit source links and publication scope markers
        run: python3 publication/validate_summit_packet.py
