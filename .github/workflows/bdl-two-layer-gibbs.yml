name: BDL two-layer exact Gibbs factors

on:
  pull_request:
    paths:
      - 'evidence/compiled-strongest/tools/bdl_two_layer_factors.py'
      - 'evidence/compiled-strongest/BDL-TWO-LAYER-EXACT-GIBBS-2026-11-03.md'
      - '.github/workflows/bdl-two-layer-gibbs.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/compiled-strongest/tools/bdl_two_layer_factors.py'
      - 'evidence/compiled-strongest/BDL-TWO-LAYER-EXACT-GIBBS-2026-11-03.md'
      - '.github/workflows/bdl-two-layer-gibbs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-two-layer-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify normalized two-layer parity Gibbs law and full-source metachecks
        run: |
          python3 evidence/compiled-strongest/tools/bdl_two_layer_factors.py > /tmp/bdl-two-layer-results.txt
          cat /tmp/bdl-two-layer-results.txt
      - name: Preserve exact two-layer source-conformance receipt
        uses: actions/upload-artifact@v4
        with:
          name: bdl-two-layer-gibbs-results
          path: /tmp/bdl-two-layer-results.txt
