name: BDL residual Fourier quotient and cold-regime acceptance

on:
  pull_request:
    paths:
      - 'evidence/compiled-strongest/tools/bdl_residual_quotient.py'
      - 'evidence/compiled-strongest/BDL-RESIDUAL-FOURIER-COLD-GATE-2026-11-03.md'
      - '.github/workflows/bdl-residual-quotient.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/compiled-strongest/tools/bdl_residual_quotient.py'
      - 'evidence/compiled-strongest/BDL-RESIDUAL-FOURIER-COLD-GATE-2026-11-03.md'
      - '.github/workflows/bdl-residual-quotient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-residual-rational-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check exact quotient duality, monotonicity and cold acceptance
        run: |
          python3 evidence/compiled-strongest/tools/bdl_residual_quotient.py > /tmp/bdl-residual-quotient.txt
          cat /tmp/bdl-residual-quotient.txt
      - name: Preserve exact finite and symbolic receipts
        uses: actions/upload-artifact@v4
        with:
          name: bdl-residual-quotient
          path: /tmp/bdl-residual-quotient.txt
