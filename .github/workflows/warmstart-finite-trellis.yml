name: Warm-start exact finite syndrome trellis

on:
  pull_request:
    paths:
      - 'evidence/compiled-strongest/tools/finite_syndrome_trellis.py'
      - 'evidence/compiled-strongest/WARMSTART-M5-FINITE-TRELLIS-2026-11-03.md'
      - '.github/workflows/warmstart-finite-trellis.yml'
  push:
    branches:
      - main
    paths:
      - 'evidence/compiled-strongest/tools/finite_syndrome_trellis.py'
      - 'evidence/compiled-strongest/WARMSTART-M5-FINITE-TRELLIS-2026-11-03.md'
      - '.github/workflows/warmstart-finite-trellis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-syndrome-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact GF(2) support, weighted trellis distribution and conditional sampling regression
        run: python3 evidence/compiled-strongest/tools/finite_syndrome_trellis.py
