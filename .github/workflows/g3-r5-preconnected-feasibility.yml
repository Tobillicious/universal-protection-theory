name: G3 R5 preconnected stream feasibility (research only)

on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/test_koru_r5_preconnected_fd_feasibility.py'
      - '.github/workflows/g3-r5-preconnected-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-seccomp-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Research-only no-new-connect regression
        run: |
          python3 -B -m unittest -v evidence/execution-boundary/test_koru_r5_preconnected_fd_feasibility.py
