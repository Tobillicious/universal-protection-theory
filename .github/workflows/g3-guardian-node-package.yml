name: G3 guardian node package

on:
  pull_request:
    paths:
      - 'guardian-node'
      - 'evidence/execution-boundary/g3_guardian_node/**'
      - 'evidence/execution-boundary/koru_*.py'
      - 'evidence/execution-boundary/g3_r6_zelda_event_packet.py'
      - 'evidence/execution-boundary/test_g3_r6_zelda_event_packet.py'
      - 'evidence/execution-boundary/g3_r7_same_head_replay_receipt.py'
      - 'evidence/execution-boundary/test_g3_r7_same_head_replay_receipt.py'
      - '.github/workflows/g3-r4-r6-combined-evidence-replay.yml'
      - '.github/workflows/g3-guardian-node-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned sources without Docker or native changes
        run: ./guardian-node check --json
      - name: Check first-start failure and readiness lifecycle
        run: python3 -m unittest discover -s evidence/execution-boundary/g3_guardian_node -p test_launcher_lifecycle.py -v
