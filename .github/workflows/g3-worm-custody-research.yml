name: G3 WORM custody research
on:
  push:
    branches:
      - research/g3-worm-custody-joint-evidence-20261118
    paths:
      - 'evidence/execution-boundary/g3_worm_custody.py'
      - 'evidence/execution-boundary/test_g3_worm_custody.py'
      - 'evidence/execution-boundary/g3_worm_pinned_receipt.py'
      - 'evidence/execution-boundary/test_g3_worm_pinned_receipt.py'
      - 'evidence/execution-boundary/g3_r7_worm_review.py'
      - 'evidence/execution-boundary/test_g3_r7_worm_review.py'
      - 'evidence/execution-boundary/g3_r7_external_review_signature.py'
      - 'evidence/execution-boundary/g3_real_effect_inventory_handoff.py'
      - 'evidence/execution-boundary/g3_r6_zelda_event_packet.py'
      - 'evidence/execution-boundary/g3_r6_same_event_evidence_audit.py'
      - 'evidence/execution-boundary/koru_operator_checkpoint_recovery.py'
      - '.github/workflows/g3-worm-custody-research.yml'
  pull_request:
    paths:
      - 'evidence/execution-boundary/g3_worm_custody.py'
      - 'evidence/execution-boundary/test_g3_worm_custody.py'
      - 'evidence/execution-boundary/g3_worm_pinned_receipt.py'
      - 'evidence/execution-boundary/test_g3_worm_pinned_receipt.py'
      - 'evidence/execution-boundary/g3_r7_worm_review.py'
      - 'evidence/execution-boundary/test_g3_r7_worm_review.py'
      - 'evidence/execution-boundary/g3_r7_external_review_signature.py'
      - 'evidence/execution-boundary/g3_real_effect_inventory_handoff.py'
      - 'evidence/execution-boundary/g3_r6_zelda_event_packet.py'
      - 'evidence/execution-boundary/g3_r6_same_event_evidence_audit.py'
      - 'evidence/execution-boundary/koru_operator_checkpoint_recovery.py'
      - '.github/workflows/g3-worm-custody-research.yml'
permissions:
  contents: read
jobs:
  hostile-worm-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned cryptography dependency
        run: python -m pip install cryptography==46.0.4
      - name: Existing joint R5/R6 and new WORM hostile tests
        working-directory: evidence/execution-boundary
        run: python -m unittest -v test_g3_real_effect_inventory_handoff test_g3_worm_custody test_g3_worm_pinned_receipt test_g3_r7_worm_review
