name: Full-law agent entrypoint integrity

# Run on every PR so required 'navigation' cannot remain pending due to path filters.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check full-law source and agent entrypoints
        run: python3 publication/check_agent_entrypoints.py
      - name: Check historical Snuffy and current physical proof banks
        run: python3 publication/check_whole_law_source_banks.py
