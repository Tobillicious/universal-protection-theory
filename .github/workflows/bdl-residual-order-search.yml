name: BDL residual elimination order and running intersection certificates

on:
  pull_request:
    paths:
      - 'evidence/compiled-strongest/tools/bdl_residual_order_search.py'
      - 'evidence/compiled-strongest/BDL-RESIDUAL-ORDER-SEARCH-2026-11-03.md'
      - '.github/workflows/bdl-residual-order-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic elimination orderings and the bag running-intersection certificates
        run: |
          python3 evidence/compiled-strongest/tools/bdl_residual_order_search.py > /tmp/bdl-orders.txt
          cat /tmp/bdl-orders.txt
      - name: Retain ordering and width measurements
        uses: actions/upload-artifact@v4
        with:
          name: bdl-residual-order-certificates
          path: /tmp/bdl-orders.txt
