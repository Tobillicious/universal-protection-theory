name: IR-142 Kernel-enforced guardian/resident separation

on:
  push:
    branches:
      - research/ir142-os-principal-sink-boundary-20261029
    paths:
      - 'evidence/compiled-strongest/installation/pilot/linux_os_principals.py'
      - '.github/workflows/ir142-os-principals.yml'
  pull_request:
    paths:
      - 'evidence/compiled-strongest/installation/pilot/linux_os_principals.py'
      - '.github/workflows/ir142-os-principals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distinct-linux-principals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kernel-enforced UID separation using actual IR-141 sink source
        run: |
          sudo "$(command -v python3)" -B evidence/compiled-strongest/installation/pilot/linux_os_principals.py
      - name: Claim boundary
        run: |
          echo 'This checks one guardian-owned sink endpoint and kernel permission denials.'
          echo 'It does not enforce all effects, authenticate unheld payloads, or prove X3.'
