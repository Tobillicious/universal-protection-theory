name: Physical bridge proofs

on:
  push:
    branches:
      - main
      - 'proofs/**'
    paths:
      - 'evidence/physical-bridges/**'
      - '.github/workflows/physical-bridges.yml'
  pull_request:
    paths:
      - 'evidence/physical-bridges/**'
      - '.github/workflows/physical-bridges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact inherited controller sources for source-level proof
        run: |
          cp evidence/papers-11-12/lean/modules/UPTFence.lean evidence/physical-bridges/UPTFence.lean
          cp evidence/papers-11-12/lean/modules/ControllerFinality.lean evidence/physical-bridges/ControllerFinality.lean
          cp evidence/papers-11-12/lean/modules/ControllerFence.lean evidence/physical-bridges/ControllerFence.lean
          cp evidence/papers-11-12/lean/UPTExistence.lean evidence/physical-bridges/UPTExistence.lean
          cp evidence/papers-11-12/lean/modules/ContextualObservation.lean evidence/physical-bridges/ContextualObservation.lean
      - name: Build proofs using pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: evidence/physical-bridges
          auto-config: false
          build: true
          # Check all declarations under our proof-library namespace,
          # including transitive dependencies (not just literal source text).
          axiom-audit: true
          axiom-audit-root: PhysicalBridges
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - name: Execute synthetic raw-JSON telemetry acceptance and rejection fixtures
        run: |
          cd evidence/physical-bridges
          lake env lean --run checks/ir78_check_file.lean fixtures/ir78-valid.json
          if lake env lean --run checks/ir78_check_file.lean fixtures/ir78-bad-tick.json; then
            echo 'IR-78 erroneously accepted missing clock tick'; exit 1
          fi
          if lake env lean --run checks/ir78_check_file.lean fixtures/ir78-missing-field.json; then
            echo 'IR-78 erroneously accepted missing required JSON data'; exit 1
          fi
      - name: Reject placeholder proofs
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' evidence/physical-bridges/PhysicalBridges --include='*.lean'; then
            echo 'Proof placeholder detected'; exit 1
          fi
      - name: Run independent finite countermodels
        run: |
          python3 evidence/physical-bridges/checks.py
          python3 evidence/physical-bridges/viability_checks.py
          python3 evidence/physical-bridges/instrument_checks.py
          python3 evidence/physical-bridges/lifecycle_checks.py
      - name: Check open-system GKSL source candidate (when present)
        run: |
          if [ -f evidence/physical-bridges/open-system/check_open_system_invariance.py ]; then
            python3 evidence/physical-bridges/open-system/check_open_system_invariance.py
          else
            echo 'Open-system candidate not included in this branch; skipping.'
          fi
      - name: Validate assurance ledger and reject unsupported claim promotions
        run: python3 evidence/physical-bridges/verify_assurance.py
      - name: Validate physical instrument evidence schema and promotion controls
        run: python3 evidence/physical-bridges/verify_instrument_evidence.py
