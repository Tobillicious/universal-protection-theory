name: Warm-start minimal-rank trellis and bounded coins

on:
  pull_request:
    paths:
      - 'evidence/compiled-strongest/tools/finite_syndrome_trellis.py'
      - 'evidence/compiled-strongest/tools/rank_syndrome_trellis.py'
      - 'evidence/compiled-strongest/tools/test_rank_syndrome_trellis.py'
      - 'evidence/compiled-strongest/WARMSTART-RANK-TRELLIS-2026-11-03.md'
      - '.github/workflows/warmstart-rank-trellis.yml'
  push:
    branches:
      - main
    paths:
      - 'evidence/compiled-strongest/tools/finite_syndrome_trellis.py'
      - 'evidence/compiled-strongest/tools/rank_syndrome_trellis.py'
      - 'evidence/compiled-strongest/tools/test_rank_syndrome_trellis.py'
      - 'evidence/compiled-strongest/WARMSTART-RANK-TRELLIS-2026-11-03.md'
      - '.github/workflows/warmstart-rank-trellis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rank-and-coin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original exact-law and new rank, domination and retained-coin checks
        run: |
          python3 --version
          python3 evidence/compiled-strongest/tools/finite_syndrome_trellis.py
          python3 evidence/compiled-strongest/tools/test_rank_syndrome_trellis.py
