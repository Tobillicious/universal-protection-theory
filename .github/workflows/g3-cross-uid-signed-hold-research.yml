            test_koru_nonce_signed_checkpoint \
            test_koru_authority_admission_journal \
            test_koru_authority_effect_time_fence \
            test_koru_isolated_authority_executor \
            test_koru_separated_authority_executor \
            test_koru_authority_owned_marker_service \
