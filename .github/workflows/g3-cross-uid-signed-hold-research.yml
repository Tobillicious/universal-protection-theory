# 78 original hostile cases split by source order; no tests discarded.
# A failed partition makes the combined acceptance checks fail closed.
jobs:
  cross-uid-part-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact tested source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography==46.0.4'
      - name: Disposable signed HOLD tests — partition 1/4
        run: |
          cd evidence/execution-boundary
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          sudo -n env PYTHONPATH=. "$PYTHON_BIN" -B -m unittest -v \
            test_koru_cross_uid_fence \
            test_koru_signed_cross_uid_hold \
            test_koru_root_hold_floor \
            test_koru_hold_intent_failures \
            test_koru_guardian_sigkill \
            test_koru_hold_ack_reconcile \
            test_koru_signed_hold_receipt \
            test_koru_hold_challenge_client \
            test_koru_local_hold_ack_socket \
            test_koru_hold_ack_real_cross_uid \
            test_koru_socket_endpoint_pin \
            test_koru_root_receipt_key \
            test_koru_provisioned_receipt_issuer \
            test_koru_guardian_key_restart \
            test_koru_independent_hold_anchor_gate \
            test_koru_signed_remote_hold_witness \
            test_koru_transactional_hold_witness \
            test_koru_transaction_scoped_effect \
            test_koru_cross_process_effect_order \
            test_koru_durable_effect_intent
  cross-uid-part-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
