  workflow_dispatch:
jobs:
  disposable-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography==46.0.4'
      - name: Disposable cross-UID signed HOLD integration
        run: |
          cd evidence/execution-boundary
          sudo --preserve-env=PATH PYTHONPATH=. python -B -m unittest -v \
            test_koru_cross_uid_fence \
            test_koru_signed_cross_uid_hold \
            test_koru_root_hold_floor \
            test_koru_hold_intent_failures \
