  workflow_dispatch:
jobs:
  disposable-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography==46.0.4'
      - name: Disposable cross-UID signed HOLD integration
        run: |
          cd evidence/execution-boundary
          sudo --preserve-env=PATH PYTHONPATH=. python -B -m unittest -v \
            test_koru_cross_uid_fence \
            test_koru_signed_cross_uid_hold \
            test_koru_root_hold_floor \
            test_koru_hold_intent_failures \
            test_koru_guardian_sigkill \
            test_koru_hold_ack_reconcile \
            test_koru_signed_hold_receipt \
            test_koru_hold_challenge_client \
            test_koru_local_hold_ack_socket \
            test_koru_hold_ack_real_cross_uid \
            test_koru_socket_endpoint_pin \
            test_koru_root_receipt_key \
            test_koru_provisioned_receipt_issuer \
            test_koru_guardian_key_restart \
            test_koru_independent_hold_anchor_gate \
            test_koru_signed_remote_hold_witness \
            test_koru_transactional_hold_witness \
            test_koru_transaction_scoped_effect \
            test_koru_cross_process_effect_order \
            test_koru_durable_effect_intent \
            test_koru_signed_effect_reconciliation \
            test_koru_external_checkpoint_contrast \
            test_koru_nonce_signed_checkpoint \
            test_koru_authority_admission_journal \
            test_koru_authority_effect_time_fence \
            test_koru_isolated_authority_executor \
            test_koru_separated_authority_executor \
            test_koru_authority_owned_marker_service \
            test_koru_authority_owned_sigkill \
            test_koru_authority_checkpoint_contrast \
            test_koru_monotonic_revision_witness \
            test_koru_cross_uid_revision_witness \
            test_koru_mtls_revision_witness \
            test_koru_client_revision_floor \
            test_koru_two_witness_agreement \
            test_koru_dual_mtls_endpoints \
            test_koru_retained_third_anchor \
            test_koru_anchor_partial_recovery \
            test_koru_signed_history_effect_fence \
            test_koru_authority_ordered_hold_effect \
            test_koru_authority_crossprocess_race \
            test_koru_no_inherited_fd_executor \
            test_koru_scm_rights_receive_guard \
            test_koru_seccomp_fd_receive_fence \
            test_koru_seccomp_path_effect_fence \
            test_koru_landlock_write_fence \
            test_koru_executor_fd_startup_audit \
            test_koru_fixed_workload_contract \
            test_koru_pinned_security_dependencies \
            test_koru_fixed_entrypoint_freeze \
            test_koru_second_hop_dependency_contract \
            test_koru_authority_malformed_wire \
            test_koru_authority_reserved_hold_capacity \
            test_koru_emergency_hold_endpoint \
            test_koru_emergency_hold_persistence \
            test_koru_integration_manifest \
            test_koru_runtime_evidence
          sudo --preserve-env=PATH PYTHONPATH=. python -B koru_runtime_evidence.py \
            --checkout-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/g3-runtime-evidence.json"
      - name: Archive G3 runtime inventory (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-runtime-inventory
          path: ${{ runner.temp }}/g3-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 14
