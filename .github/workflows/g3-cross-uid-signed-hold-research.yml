            test_koru_integration_manifest \
            test_koru_runtime_evidence \
            test_koru_authority_child_runtime_observation
  confined-child-syscall-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact tested source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography==46.0.4'
      - name: Trace actual confined child syscalls (R5 research only)
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq strace
          cd evidence/execution-boundary
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          sudo -n strace -ff -qq -s 1024 -o "$RUNNER_TEMP/g3-r5-trace" \
            -e trace=all \
            env PYTHONPATH=. "$PYTHON_BIN" -B -m unittest -v \
              test_koru_no_inherited_fd_executor.NoInheritedFdTests.test_fixed_launcher_can_request_one_authority_owned_effect \
              test_koru_no_inherited_fd_executor.NoInheritedFdTests.test_hold_first_denies_fixed_launcher
          sudo -n env PYTHONPATH=. "$PYTHON_BIN" -B koru_r5_observed_syscalls.py \
            --trace-prefix "$RUNNER_TEMP/g3-r5-trace" \
            --output "$RUNNER_TEMP/g3-r5-syscall-inventory.json"
          sudo -n chmod 0644 "$RUNNER_TEMP/g3-r5-syscall-inventory.json"
      - name: Archive G3 R5 observed syscall inventory (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-r5-observed-syscalls
          path: ${{ runner.temp }}/g3-r5-syscall-inventory.json
          if-no-files-found: warn
          retention-days: 14
  consolidated-runtime-evidence:
    needs: [cross-uid-part-1, cross-uid-part-2, cross-uid-part-3, cross-uid-part-4, confined-child-syscall-trace]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact tested source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography==46.0.4'
      - name: Compute scoped runtime inventory after every partition passed
        run: |
          cd evidence/execution-boundary
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          sudo -n env PYTHONPATH=. "$PYTHON_BIN" -B koru_runtime_evidence.py \
            --checkout-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/g3-runtime-evidence.json"
      - name: Archive G3 runtime inventory (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-runtime-inventory
          path: ${{ runner.temp }}/g3-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 14
