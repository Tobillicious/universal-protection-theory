name: G3 cross-UID signed HOLD research (non-deploying)
on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/koru_cross_uid_authority.py'
      - 'evidence/execution-boundary/test_koru_signed_cross_uid_hold.py'
      - 'evidence/execution-boundary/koru_cross_uid_fence.py'
      - 'evidence/execution-boundary/test_koru_cross_uid_fence.py'
      - 'evidence/execution-boundary/koru_root_hold_floor.py'
      - 'evidence/execution-boundary/test_koru_root_hold_floor.py'
      - 'evidence/execution-boundary/test_koru_hold_intent_failures.py'
      - 'evidence/execution-boundary/test_koru_guardian_sigkill.py'
      - 'evidence/execution-boundary/test_koru_hold_ack_reconcile.py'
      - 'evidence/execution-boundary/koru_signed_hold_receipt.py'
      - 'evidence/execution-boundary/test_koru_signed_hold_receipt.py'
      - 'evidence/execution-boundary/koru_hold_challenge_client.py'
      - 'evidence/execution-boundary/test_koru_hold_challenge_client.py'
      - 'evidence/execution-boundary/koru_local_hold_ack_socket.py'
      - 'evidence/execution-boundary/test_koru_local_hold_ack_socket.py'
      - 'evidence/execution-boundary/test_koru_hold_ack_real_cross_uid.py'
      - 'evidence/execution-boundary/koru_socket_endpoint_pin.py'
      - 'evidence/execution-boundary/test_koru_socket_endpoint_pin.py'
      - 'evidence/execution-boundary/koru_root_receipt_key.py'
      - 'evidence/execution-boundary/test_koru_root_receipt_key.py'
      - 'evidence/execution-boundary/koru_provisioned_receipt_issuer.py'
      - 'evidence/execution-boundary/test_koru_provisioned_receipt_issuer.py'
      - 'evidence/execution-boundary/test_koru_guardian_key_restart.py'
      - 'evidence/execution-boundary/koru_independent_hold_anchor_gate.py'
      - 'evidence/execution-boundary/test_koru_independent_hold_anchor_gate.py'
      - '.github/workflows/g3-cross-uid-signed-hold-research.yml'
  workflow_dispatch:
jobs:
  disposable-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography==46.0.4'
      - name: Disposable cross-UID signed HOLD integration
        run: |
          cd evidence/execution-boundary
          sudo --preserve-env=PATH PYTHONPATH=. python -B -m unittest -v \
            test_koru_cross_uid_fence \
            test_koru_signed_cross_uid_hold \
            test_koru_root_hold_floor \
            test_koru_hold_intent_failures \
            test_koru_guardian_sigkill \
            test_koru_hold_ack_reconcile \
            test_koru_signed_hold_receipt \
            test_koru_hold_challenge_client \
            test_koru_local_hold_ack_socket \
            test_koru_hold_ack_real_cross_uid \
            test_koru_socket_endpoint_pin \
            test_koru_root_receipt_key \
            test_koru_provisioned_receipt_issuer \
            test_koru_guardian_key_restart \
            test_koru_independent_hold_anchor_gate
