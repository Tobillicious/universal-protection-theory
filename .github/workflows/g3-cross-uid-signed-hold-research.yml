            test_koru_nonce_signed_checkpoint \
            test_koru_authority_admission_journal \
            test_koru_authority_effect_time_fence \
            test_koru_isolated_authority_executor \
            test_koru_separated_authority_executor \
            test_koru_authority_owned_marker_service \
            test_koru_authority_owned_sigkill \
            test_koru_authority_checkpoint_contrast \
            test_koru_monotonic_revision_witness \
            test_koru_cross_uid_revision_witness \
            test_koru_mtls_revision_witness \
            test_koru_client_revision_floor \
            test_koru_two_witness_agreement \
            test_koru_dual_mtls_endpoints \
            test_koru_retained_third_anchor \
            test_koru_anchor_partial_recovery \
            test_koru_signed_history_effect_fence \
