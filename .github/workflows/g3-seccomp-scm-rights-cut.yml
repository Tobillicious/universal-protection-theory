name: G3 kernel SCM_RIGHTS receipt denial contrast (research only)
on:
  pull_request:
    paths:
      - 'evidence/execution-boundary/g3_prod_01/test_g3_seccomp_scm_rights_cut.py'
      - 'evidence/execution-boundary/fuzz_gmesh_boundary_leakage.py'
      - 'evidence/execution-boundary/g3_prod_01/test_g3_scm_rights_cut.py'
      - 'evidence/execution-boundary/g3_prod_01/g3_monitor.py'
      - '.github/workflows/g3-seccomp-scm-rights-cut.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-scm-rights-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require native Linux x86-64 runner and seccomp availability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -qw Seccomp /proc/self/status
      - name: Prove unrestricted #475 bypass AND confined receiver denial
        run: |
          cd evidence/execution-boundary/g3_prod_01
          sudo -n python3 -B -m unittest -v \
            test_g3_scm_rights_cut.py \
            test_g3_seccomp_scm_rights_cut.py
