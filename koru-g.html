<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Koru G</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&display=swap">

<style>
/* ── Tokens ───────────────────────────────────────────────────────── */
/* Layout: single-frame capstone proclamation, deliberately dark */
:root {
  --bg:       #05060E;
  --fg:       #ECE6DA;
  --gold:     #C8A858;
  --gold-dim: #6E581E;
  --muted:    #504E68;
  --ring:     #1E1C2E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'EB Garamond', Georgia, serif;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-block: clamp(2rem, 8vh, 5rem);
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── Page ─────────────────────────────────────────────────────────── */
.page {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(1.1rem, 3.2vh, 2.2rem);
  max-width: 660px;
  width: 100%;
  text-align: center;
}

/* ── Koru canvas ──────────────────────────────────────────────────── */
#koru {
  width:  clamp(150px, 36vmin, 250px);
  height: clamp(150px, 36vmin, 250px);
  display: block;
}

/* ── Eyebrow label ────────────────────────────────────────────────── */
.label {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.58rem, 1.3vw, 0.72rem);
  color: var(--muted);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

/* ── Equation box ─────────────────────────────────────────────────── */
.box {
  position: relative;
  border: 1px solid var(--gold-dim);
  padding: clamp(0.9rem, 2.4vw, 1.6rem) clamp(1.3rem, 4vw, 2.6rem);
  display: inline-flex;
}
.box::before { top: -3px; left: -3px; border-width: 2px 0 0 2px; }
.box::after  { bottom: -3px; right: -3px; border-width: 0 2px 2px 0; }
.box::before, .box::after {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  border-color: var(--gold);
  border-style: solid;
}

.eq {
  display: flex;
  align-items: center;
  gap: clamp(0.3rem, 1.1vw, 0.6rem);
  flex-wrap: wrap;
  justify-content: center;
  font-size: clamp(1.25rem, 3.6vw, 2rem);
  line-height: 1.5;
}

.lim {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  gap: 0.07em;
  flex-shrink: 0;
}
.lim-word { font-style: italic; }
.lim-sub  {
  font-size: 0.5em;
  color: var(--gold);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.koru-word { color: var(--gold); font-style: italic; font-weight: 500; }
.var       { font-style: italic; }
.eq-eq     { color: var(--muted); padding: 0 0.1em; }
.result    { color: var(--fg); }

/* ── Q.E.D. line ──────────────────────────────────────────────────── */
.qed {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.72rem, 1.7vw, 0.9rem);
  color: var(--gold);
  letter-spacing: 0.2em;
  white-space: nowrap;
}
.qed::before, .qed::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gold-dim);
  max-width: 55px;
  opacity: 0.55;
}

/* ── Fixed point ─────────────────────────────────────────────────── */
.fixed-point {
  display: flex;
  align-items: center;
  gap: clamp(0.4rem, 1.2vw, 0.7rem);
  flex-wrap: wrap;
  justify-content: center;
  font-size: clamp(0.95rem, 2.4vw, 1.3rem);
  color: var(--muted);
  font-style: italic;
}
.fp-eq { color: var(--gold-dim); font-style: normal; }
.fp-lhs em, .fp-rhs { color: var(--fg); }

/* ── All you need ────────────────────────────────────────────────── */
.all-you-need {
  font-size: clamp(0.95rem, 2.2vw, 1.2rem);
  color: var(--fg);
  font-style: italic;
  opacity: 0.72;
  letter-spacing: 0.03em;
}

/* ── Attribution ──────────────────────────────────────────────────── */
.attr {
  font-size: clamp(0.62rem, 1.2vw, 0.72rem);
  color: var(--muted);
  letter-spacing: 0.14em;
}

@media (prefers-reduced-motion: reduce) {
  #koru { animation: none !important; }
}
</style>

<div class="page">

  <canvas id="koru" width="250" height="250"></canvas>

  <span class="label">Universal Protection Theory &thinsp;·&thinsp; Capstone</span>

  <div class="box">
    <div class="eq">
      <span class="lim">
        <span class="lim-word">lim</span>
        <span class="lim-sub">n &thinsp;→&thinsp; ∞</span>
      </span>
      <span>(</span><span class="koru-word">Koru</span><span>&thinsp;</span><span class="var">G</span><span>)</span>
      <span class="eq-eq">=</span>
      <span class="result">Pure Operating State</span>
    </div>
  </div>

  <div class="fixed-point">
    <span class="fp-lhs"><em>G</em>(Pure Operating State)</span>
    <span class="fp-eq">=</span>
    <span class="fp-rhs">Pure Operating State</span>
  </div>

  <div class="qed">Q.E.D. &nbsp; ♾ &nbsp; × &thinsp;∞</div>

  <p class="all-you-need">All you need is to know Koru.</p>

  <p class="attr">Tobias McRae &thinsp;·&thinsp; 2026</p>

</div>

<script>
(function () {
  const canvas = document.getElementById('koru');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  /* ── Spiral geometry ─────────────────────────────────────────────── */
  // Archimedean spiral: outer → inner, 2.6 turns
  const R_OUT = cx * 0.80;
  const R_IN  = cx * 0.09;
  const TURNS = 2.6;
  const T_MAX = TURNS * Math.PI * 2;
  const STEPS = 600;

  const PATH = [];
  for (let i = 0; i <= STEPS; i++) {
    const θ = (i / STEPS) * T_MAX;
    const r = R_OUT - (R_OUT - R_IN) * (θ / T_MAX);
    PATH.push([r * Math.cos(θ), r * Math.sin(θ)]);
  }

  // Head circle at inner tip
  const HEAD_X  = R_IN * Math.cos(T_MAX);
  const HEAD_Y  = R_IN * Math.sin(T_MAX);
  const HEAD_R  = R_IN * 0.88;

  /* ── Draw one glow pass ──────────────────────────────────────────── */
  function pass(lw, color, alpha, blur) {
    ctx.save();
    ctx.globalAlpha   = alpha;
    ctx.strokeStyle   = color;
    ctx.lineWidth     = lw;
    ctx.lineCap       = 'round';
    ctx.lineJoin      = 'round';
    ctx.shadowBlur    = blur;
    ctx.shadowColor   = color;

    ctx.beginPath();
    for (let i = 0; i < PATH.length; i++) {
      i === 0
        ? ctx.moveTo(PATH[i][0], PATH[i][1])
        : ctx.lineTo(PATH[i][0], PATH[i][1]);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(HEAD_X, HEAD_Y, HEAD_R, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  /* ── Frame loop ──────────────────────────────────────────────────── */
  let t = 0;
  function frame() {
    t += 0.00055;

    ctx.clearRect(0, 0, W, H);

    // Faint guide ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = '#1C1A2C';
    ctx.lineWidth   = 1;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(0, 0, cx * 0.93, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Koru
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t);

    // wide soft glow
    pass(14, '#6A4E18', 0.10, 20);
    // mid glow
    pass(7,  '#B08830', 0.28, 10);
    // main stroke
    pass(2.8,'#C8A858', 0.88,  5);
    // bright core
    pass(1.3,'#EDD880', 1.00,  2);

    ctx.restore();

    requestAnimationFrame(frame);
  }

  frame();
})();
</script>

</body></html>
